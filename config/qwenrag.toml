# QwenRAG application settings. Relative paths are relative to this file.
# The RAG pipeline is NOT configured here: it comes from the pinned rag-ufc-core
# release (RELEASE.json). Only deployment details belong in [core.deployment].

data_root = "../data"            # collections/ (Markdown corpus), cache/rag_v2/ (indexes), conversations.json
conversations_file = "conversations.json"
env_file = "../.env"             # secrets such as LLM_API_KEY; exported variables take precedence
frontend_dist = "../frontend/dist"  # built UI served at "/" (npm run build); API stays under /api
max_upload_mb = 200

[chat]
history_messages = 6
max_sessions = 6
title_max_chars = 34
excerpt_chars = 900
default_title = "Nova conversa"

# Models offered in the UI. Only the release's approved model is accepted unless
# core.allow_divergent_pipeline is true.
[[models]]
model_name = "nvidia/Qwen3.6-35B-A3B-NVFP4"
label = "Qwen 3.6 — Spark"

[core]
lock = "../core-release.lock.json"
# Keep false: a pipeline that differs from the approved release refuses to start.
# This deployment deliberately changes output token limits and the reranker.
allow_divergent_pipeline = true
spark_tokenization = true

# Local end of the SSH tunnel to the Spark's port 8006.
[core.reranker]
base_url = "http://127.0.0.1:18006"
model = "nvidia/Nemotron-3.5-Rerank-8B-BF16"
timeout_seconds = 120

[core.spark_retrieval]
embedding_url = "http://127.0.0.1:18003"
embedding_model = "nvidia/Nemotron-3-Embed-8B-BF16"
lexical_url = "http://127.0.0.1:18007"
lexical_revision = "5617a9f61b028005a4858fdac845db406aefb181"
timeout_seconds = 120

[core.deployment.llm]
timeout_seconds = 420

[core.deployment.llm.providers.spark]
base_url = "http://127.0.0.1:18000/v1"
api_key_env = "LLM_API_KEY"

[core.deployment.retrieval]
device = "cpu"
batch_size = 8
embedding_timeout_seconds = 120

# Deliberate pipeline changes; reported as "divergent".
# Output token limits doubled from the release (2048 -> 4096): answers were
# being refused as truncated ("A saída atingiu max_tokens").
[core.overrides.llm]
max_output_tokens = 4096

[core.overrides.llm.role_max_output_tokens]
planner = 1024
research = 768
reasoning = 1536
answer = 4096
verification = 2048  # doubled twice: 1024 still truncated
source_focus = 768
