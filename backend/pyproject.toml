[project]
name = "qwenrag-backend"
version = "0.1.0"
description = "QwenRAG API: conversations, uploads and SSE over the pinned rag-ufc-core release."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.141.1,<1",
    "uvicorn>=0.44.0,<1",
    "python-multipart>=0.0.24",
    "pydantic>=2.11.10,<3",
    "python-dotenv>=1.1.1,<2",
    # The RAG engine. Pinned to an immutable commit of an approved release; see
    # core-release.lock.json and docs/core-upgrade.md. Never edit or vendor its code here.
    "rag-ufc-core[docling]==1.0.0",
    # Direct only so the CPU wheel source below applies (same version range as the core).
    "torch>=2.11.0,<2.12",
]

[dependency-groups]
dev = ["pytest>=8.3.5", "httpx>=0.28.1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qwenrag"]

[tool.uv.sources]
# Immutable pin: the commit of an approved core release (core-release.lock.json records it).
rag-ufc-core = { git = "https://github.com/ianzin30/RAG_UFC.git", rev = "94d1c84b77433f86fbd499b08f3647dab6489598", subdirectory = "packages/rag-ufc-core" }
# CPU wheels: the application runs embeddings through Ollama and reranks on CPU.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
